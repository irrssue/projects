<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects.irrssue.com</title>
    <style>
        :root {
            --bg: #000000;
            --node: #ffffff;
            --edge: #ffffff;
            --source: #ff3b30;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: pinch-zoom; /* single-finger drags reach the graph, pinch stays native */
            cursor: grab;
        }
        svg.panning { cursor: grabbing; }
        .edge {
            stroke: var(--edge);
            stroke-width: 1.2;
            opacity: 0.35;
            transition: opacity 0.15s, stroke-width 0.15s;
        }
        .node { cursor: grab; }
        .node.dragging { cursor: grabbing; }
        .node-circle { fill: var(--node); }
        .node-circle.source { fill: var(--source); }
        .node-label {
            fill: var(--node);
            font-family: var(--font);
            font-size: 12px;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }
        .node-label.source {
            fill: var(--source);
            font-size: 14px;
            font-weight: 600;
        }
        .node, .edge { transition: opacity 0.15s; }
        /* Obsidian-style focus: hovering a node dims everything it does not touch. */
        svg.dim .node { opacity: 0.25; }
        svg.dim .node.hl { opacity: 1; }
        svg.dim .edge { opacity: 0.06; }
        svg.dim .edge.hl { opacity: 0.9; stroke-width: 2; }
        .node:focus-visible .node-circle { stroke: var(--source); stroke-width: 3; }
        /* The viewBox shrinks everything on a phone, so grow the type to compensate. */
        @media (max-width: 600px) {
            .node-label { font-size: 22px; }
            .node-label.source { font-size: 26px; }
        }
        noscript ul {
            font-family: var(--font);
            color: var(--node);
            position: fixed;
            top: 2rem;
            left: 2rem;
            line-height: 1.9;
        }
        noscript a { color: var(--node); }
    </style>
</head>
<body>
    <svg id="graph" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
        <g id="view">
            <g id="edges"></g>
            <g id="nodes"></g>
        </g>
    </svg>

    <noscript>
        <ul>
            <li><a href="https://irrssue.com">irrssue.com</a></li>
            <li><a href="https://news.irrssue.com">news.irrssue.com</a></li>
            <li><a href="https://mail.irrssue.com">mail.irrssue.com</a></li>
            <li><a href="https://upload.irrssue.com">upload.irrssue.com</a></li>
            <li><a href="https://resume.irrssue.com">resume.irrssue.com</a></li>
            <li><a href="https://ssh.irrssue.com">ssh.irrssue.com</a></li>
            <li><a href="https://irrssue.com/drawsomething/">irrssue.com/drawsomething</a></li>
            <li><a href="https://irrssue.com/windchime/">irrssue.com/windchime</a></li>
            <li><a href="https://irrssue.com/code/">irrssue.com/code</a></li>
            <li><a href="https://irrssue.com/lockin/">irrssue.com/lockin</a></li>
            <li><a href="https://irrssue.com/mood-receipt/">irrssue.com/mood-receipt</a></li>
            <li><a href="https://irrssue.com/solarsystem/">irrssue.com/solarsystem</a></li>
        </ul>
    </noscript>

    <script>
        // Obsidian-style graph view: force-directed, draggable nodes, pan + zoom.
        // ponytail: node list is hand-curated from a DNS + link sweep done once,
        // not fetched live. Re-run the sweep and edit this array when adding sites.
        const nodes = [
            { name: "irrssue.com", url: "https://irrssue.com", source: true },
            { name: "news.irrssue.com", url: "https://news.irrssue.com" },
            { name: "mail.irrssue.com", url: "https://mail.irrssue.com" },
            { name: "upload.irrssue.com", url: "https://upload.irrssue.com" },
            { name: "resume.irrssue.com", url: "https://resume.irrssue.com" },
            { name: "ssh.irrssue.com", url: "https://ssh.irrssue.com" },
            { name: "irrssue.com/drawsomething", url: "https://irrssue.com/drawsomething/" },
            { name: "irrssue.com/windchime", url: "https://irrssue.com/windchime/" },
            { name: "irrssue.com/code", url: "https://irrssue.com/code/" },
            { name: "irrssue.com/lockin", url: "https://irrssue.com/lockin/" },
            { name: "irrssue.com/mood-receipt", url: "https://irrssue.com/mood-receipt/" },
            { name: "irrssue.com/solarsystem", url: "https://irrssue.com/solarsystem/" },
        ];
        // Star topology: everything hangs off the source node.
        const links = nodes.slice(1).map((_, i) => ({ a: 0, b: i + 1 }));

        const REPEL = 26000;    // node-node push, falls off with distance squared
        const LINK_LEN = 210;   // spring rest length
        const LINK_K = 0.006;   // spring stiffness
        const GRAVITY = 0.0016; // pull toward canvas centre, keeps the graph on screen
        const DAMPING = 0.86;
        const SOURCE_R = 14, NODE_R = 9;
        const SIZE = 1000, CX = SIZE / 2, CY = SIZE / 2; // graph space; the viewBox fits it to the window

        const NS = "http://www.w3.org/2000/svg";
        const svg = document.getElementById("graph");
        const view = document.getElementById("view");
        const edgesG = document.getElementById("edges");
        const nodesG = document.getElementById("nodes");

        const camera = { x: 0, y: 0, k: 1 };
        let dragNode = null;

        // Seed the layout as a ring so the simulation starts tidy instead of chaotic.
        function seed() {
            nodes[0].x = CX; nodes[0].y = CY;
            const r = SIZE * 0.3;
            nodes.slice(1).forEach((n, i) => {
                const angle = (i / (nodes.length - 1)) * Math.PI * 2 - Math.PI / 2;
                n.x = CX + r * Math.cos(angle);
                n.y = CY + r * Math.sin(angle);
            });
            nodes.forEach(n => { n.vx = 0; n.vy = 0; });
        }

        const adjacency = nodes.map(() => new Set());
        links.forEach(l => { adjacency[l.a].add(l.b); adjacency[l.b].add(l.a); });

        const linkEls = links.map(() => {
            const line = document.createElementNS(NS, "line");
            line.setAttribute("class", "edge");
            edgesG.appendChild(line);
            return line;
        });

        const nodeEls = nodes.map((n, i) => {
            const a = document.createElementNS(NS, "a");
            a.setAttribute("class", "node");
            a.setAttribute("href", n.url);
            a.setAttribute("target", "_blank");
            a.setAttribute("rel", "noopener");

            const circle = document.createElementNS(NS, "circle");
            circle.setAttribute("class", "node-circle" + (n.source ? " source" : ""));
            circle.setAttribute("r", n.source ? SOURCE_R : NODE_R);

            const label = document.createElementNS(NS, "text");
            label.setAttribute("class", "node-label" + (n.source ? " source" : ""));
            label.textContent = n.name;

            a.append(circle, label);
            nodesG.appendChild(a);
            bindNode(a, n, i);
            return { a, circle, label };
        });

        function radius(n) { return n.source ? SOURCE_R : NODE_R; }

        // Phones get the bare site name so the bigger type still fits between nodes.
        const narrow = window.matchMedia("(max-width: 600px)");
        function relabel() {
            nodes.forEach((n, i) => {
                nodeEls[i].label.textContent = narrow.matches
                    ? n.name.replace(/^irrssue\.com\//, "").replace(/\.irrssue\.com$/, "")
                    : n.name;
            });
        }
        narrow.addEventListener("change", relabel);
        relabel();

        function step() {
            // ponytail: O(n^2) repulsion, fine for a dozen nodes. Swap in a quadtree
            // if this list ever grows past a few hundred.
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const a = nodes[i], b = nodes[j];
                    let dx = b.x - a.x, dy = b.y - a.y;
                    let d2 = dx * dx + dy * dy;
                    if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
                    const d = Math.sqrt(d2);
                    const f = REPEL / d2;
                    const fx = (dx / d) * f, fy = (dy / d) * f;
                    a.vx -= fx; a.vy -= fy;
                    b.vx += fx; b.vy += fy;
                }
            }

            for (const l of links) {
                const a = nodes[l.a], b = nodes[l.b];
                const dx = b.x - a.x, dy = b.y - a.y;
                const d = Math.hypot(dx, dy) || 1;
                const f = (d - LINK_LEN) * LINK_K;
                const fx = (dx / d) * f, fy = (dy / d) * f;
                a.vx += fx; a.vy += fy;
                b.vx -= fx; b.vy -= fy;
            }

            let fastest = 0;
            for (const n of nodes) {
                n.vx += (CX - n.x) * GRAVITY;
                n.vy += (CY - n.y) * GRAVITY;
                if (n === dragNode) { n.vx = 0; n.vy = 0; continue; }
                n.vx *= DAMPING; n.vy *= DAMPING;
                n.x += n.vx; n.y += n.vy;
                fastest = Math.max(fastest, Math.abs(n.vx), Math.abs(n.vy));
            }
            return fastest;
        }

        function render() {
            view.setAttribute("transform", `translate(${camera.x},${camera.y}) scale(${camera.k})`);
            links.forEach((l, i) => {
                const a = nodes[l.a], b = nodes[l.b];
                const line = linkEls[i];
                line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
                line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
            });
            nodes.forEach((n, i) => {
                const el = nodeEls[i];
                el.circle.setAttribute("cx", n.x);
                el.circle.setAttribute("cy", n.y);
                el.label.setAttribute("x", n.x);
                el.label.setAttribute("y", n.y + radius(n) + 16);
            });
        }

        let running = false;
        function run() {
            if (running) return;
            running = true;
            requestAnimationFrame(function frame() {
                const fastest = step();
                render();
                if (fastest < 0.05 && !dragNode) { running = false; return; }
                requestAnimationFrame(frame);
            });
        }

        // Screen pixels -> SVG user space. `target` is the element whose transform
        // chain we want to undo: the svg root for camera space, #view for graph space.
        const point = svg.createSVGPoint();
        function toSvg(event, target) {
            point.x = event.clientX;
            point.y = event.clientY;
            return point.matrixTransform(target.getScreenCTM().inverse());
        }
        const toGraph = e => toSvg(e, view);

        function bindNode(el, node, index) {
            let moved = false;

            el.addEventListener("pointerdown", e => {
                e.preventDefault();
                e.stopPropagation();
                el.setPointerCapture(e.pointerId);
                dragNode = node;
                moved = false;
                el.classList.add("dragging");
                run();
            });

            el.addEventListener("pointermove", e => {
                if (dragNode !== node) return;
                const p = toGraph(e);
                if (Math.hypot(p.x - node.x, p.y - node.y) > 2 / camera.k) moved = true;
                node.x = p.x; node.y = p.y;
                run();
            });

            const release = e => {
                if (dragNode !== node) return;
                dragNode = null;
                el.classList.remove("dragging");
                run();
            };
            el.addEventListener("pointerup", release);
            el.addEventListener("pointercancel", release);

            el.addEventListener("click", e => {
                if (moved) { e.preventDefault(); return; } // a drag is not a click
                kick(node);
            });

            el.addEventListener("pointerenter", () => highlight(index));
            el.addEventListener("pointerleave", () => highlight(null));
            el.addEventListener("focus", () => highlight(index));
            el.addEventListener("blur", () => highlight(null));
        }

        // A plain click still opens the site, and shoves the node so the graph reacts.
        function kick(node) {
            const dx = node.x - CX, dy = node.y - CY;
            const d = Math.hypot(dx, dy) || 1;
            node.vx += (dx / d) * 34;
            node.vy += (dy / d) * 34;
            run();
        }

        function highlight(index) {
            svg.classList.toggle("dim", index !== null);
            nodeEls.forEach((el, i) => {
                el.a.classList.toggle("hl", index !== null && (i === index || adjacency[index].has(i)));
            });
            linkEls.forEach((line, i) => {
                const l = links[i];
                line.classList.toggle("hl", index !== null && (l.a === index || l.b === index));
            });
        }

        // Drag empty space to pan.
        let pan = null;
        svg.addEventListener("pointerdown", e => {
            const p = toSvg(e, svg);
            pan = { x: p.x - camera.x, y: p.y - camera.y };
            svg.classList.add("panning");
            svg.setPointerCapture(e.pointerId);
        });
        svg.addEventListener("pointermove", e => {
            if (!pan) return;
            const p = toSvg(e, svg);
            camera.x = p.x - pan.x;
            camera.y = p.y - pan.y;
            render();
        });
        const endPan = () => { pan = null; svg.classList.remove("panning"); };
        svg.addEventListener("pointerup", endPan);
        svg.addEventListener("pointercancel", endPan);

        // Wheel / pinch to zoom, anchored on the cursor.
        svg.addEventListener("wheel", e => {
            e.preventDefault();
            const k = Math.min(4, Math.max(0.3, camera.k * Math.exp(-e.deltaY * 0.002)));
            const p = toSvg(e, svg);
            camera.x = p.x - (p.x - camera.x) * (k / camera.k);
            camera.y = p.y - (p.y - camera.y) * (k / camera.k);
            camera.k = k;
            render();
        }, { passive: false });

        seed();
        run();
    </script>
</body>
</html>
